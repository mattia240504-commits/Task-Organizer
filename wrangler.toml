name = "promemoria"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "promemoria"
database_id = "d56c71a4-0d48-4ea8-aeca-9f39321e9147"
migrations_dir = "migrations"

# IA gratuita di Cloudflare (Workers AI): se non disponibile si usano le regole
[ai]
binding = "AI"

[triggers]
# Ogni minuto controlla i promemoria da notificare
crons = ["* * * * *"]

[vars]
TIMEZONE = "Europe/Rome"
VAPID_SUBJECT = "mailto:promemoria@example.com"
# Segreti (da impostare con `npx wrangler secret put NOME`):
# APP_TOKEN, VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY
